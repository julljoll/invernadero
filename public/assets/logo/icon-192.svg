<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" stroke="#10b981" stroke-width="3" stroke-opacity="0.4"/>
  
  <!-- Subtle Grid Accent -->
  <path d="M 24 96 L 168 96 M 96 24 L 96 168" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4"/>

  <!-- Greenhouse Canopy Arch Silhouette -->
  <path d="M 38 138 L 38 92 Q 96 46 154 92 L 154 138 Z" fill="none" stroke="url(#emeraldGrad)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Greenhouse Mesh Texture Grid lines -->
  <path d="M 58 138 L 58 80 M 77 138 L 77 69 M 96 138 L 96 62 M 115 138 L 115 69 M 134 138 L 134 80" stroke="#10b981" stroke-width="2" stroke-opacity="0.35"/>
  <path d="M 38 108 L 154 108 M 48 88 L 144 88" stroke="#10b981" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Sprout / Plant Symbol in Center -->
  <path d="M 96 134 Q 96 102 78 90 Q 94 92 96 112 Q 98 92 114 90 Q 96 102 96 134 Z" fill="url(#emeraldGrad)" filter="url(#glow)"/>
  
  <!-- Water Drop (Hydrogeology & FAO-56) -->
  <path d="M 96 40 C 90 52 84 62 84 70 C 84 76.6 89.4 82 96 82 C 102.6 82 108 76.6 108 70 C 108 62 102 52 96 40 Z" fill="url(#cyanGrad)" filter="url(#glow)"/>

  <!-- Base Ground Line -->
  <line x1="30" y1="138" x2="162" y2="138" stroke="url(#amberGrad)" stroke-width="4" stroke-linecap="round"/>
</svg>
