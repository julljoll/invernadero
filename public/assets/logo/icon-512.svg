<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="emeraldGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cyanGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="amberGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)" stroke="#10b981" stroke-width="8" stroke-opacity="0.45"/>
  
  <!-- Grid Accent -->
  <path d="M 64 256 L 448 256 M 256 64 L 256 448" stroke="#334155" stroke-width="4" stroke-dasharray="10,10" opacity="0.4"/>

  <!-- Greenhouse Canopy Arch Silhouette -->
  <path d="M 100 368 L 100 245 Q 256 122 412 245 L 412 368 Z" fill="none" stroke="url(#emeraldGrad512)" stroke-width="16" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow512)"/>

  <!-- Greenhouse Mesh Grid lines -->
  <path d="M 154 368 L 154 213 M 205 368 L 205 184 M 256 368 L 256 165 M 307 368 L 307 184 M 358 368 L 358 213" stroke="#10b981" stroke-width="5" stroke-opacity="0.35"/>
  <path d="M 100 288 L 412 288 M 128 235 L 384 235" stroke="#10b981" stroke-width="5" stroke-opacity="0.35"/>

  <!-- Plant Sprout -->
  <path d="M 256 357 Q 256 272 208 240 Q 250 245 256 298 Q 262 245 304 240 Q 256 272 256 357 Z" fill="url(#emeraldGrad512)" filter="url(#glow512)"/>
  
  <!-- Water Drop -->
  <path d="M 256 107 C 240 139 224 165 224 187 C 224 204.6 238.4 219 256 219 C 273.6 219 288 204.6 288 187 C 288 165 272 139 256 107 Z" fill="url(#cyanGrad512)" filter="url(#glow512)"/>

  <!-- Base Ground Line -->
  <line x1="80" y1="368" x2="432" y2="368" stroke="url(#amberGrad512)" stroke-width="10" stroke-linecap="round"/>
</svg>
