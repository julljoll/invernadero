<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" style="background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Soils and Gradients -->
    <linearGradient id="soilGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#92623b" />
      <stop offset="100%" stop-color="#5C3A21" />
    </linearGradient>
    <pattern id="soilTexture" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#000" opacity="0.1" />
      <circle cx="12" cy="8" r="1.5" fill="#000" opacity="0.1" />
      <circle cx="6" cy="16" r="1" fill="#000" opacity="0.1" />
    </pattern>

    <!-- Markers for arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#fef08a" />
    </marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>

    <!-- The Plant Component -->
    <g id="pepperPlant">
      <!-- Wet Bulb (Bulbo húmedo) visible underneath the plant -->
      <circle cx="0" cy="0" r="50" fill="#3b82f6" opacity="0.25" />
      <circle cx="0" cy="0" r="30" fill="#3b82f6" opacity="0.35" />
      
      <!-- Canopy (Follaje) -->
      <circle cx="0" cy="0" r="40" fill="#22c55e" opacity="0.85" />
      <!-- Stylized leaves -->
      <path d="M 0 -8 C -20 -40, -30 -25, 0 0 C 30 -25, 20 -40, 0 -8 Z" fill="#16a34a" transform="rotate(0)" />
      <path d="M 0 -8 C -20 -40, -30 -25, 0 0 C 30 -25, 20 -40, 0 -8 Z" fill="#16a34a" transform="rotate(72)" />
      <path d="M 0 -8 C -20 -40, -30 -25, 0 0 C 30 -25, 20 -40, 0 -8 Z" fill="#16a34a" transform="rotate(144)" />
      <path d="M 0 -8 C -20 -40, -30 -25, 0 0 C 30 -25, 20 -40, 0 -8 Z" fill="#16a34a" transform="rotate(216)" />
      <path d="M 0 -8 C -20 -40, -30 -25, 0 0 C 30 -25, 20 -40, 0 -8 Z" fill="#16a34a" transform="rotate(288)" />
      
      <!-- Peppers (Pimentones rojos y verdes) -->
      <circle cx="18" cy="-18" r="6" fill="#dc2626" />
      <circle cx="-12" cy="22" r="6" fill="#dc2626" />
      <circle cx="-22" cy="-12" r="5" fill="#4ade80" stroke="#166534" stroke-width="0.5"/>
      <circle cx="15" cy="15" r="5" fill="#dc2626" />
      
      <!-- Stalk (Tallo central) -->
      <circle cx="0" cy="0" r="5" fill="#064e3b" />
    </g>

    <!-- Dripper component -->
    <g id="dripper">
      <!-- Outer casing -->
      <circle cx="0" cy="0" r="5" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
      <!-- Drop of water -->
      <circle cx="0" cy="0" r="2" fill="#60a5fa" />
    </g>
  </defs>

  <!-- Header -->
  <rect x="0" y="0" width="800" height="60" fill="#0f172a" />
  <text x="400" y="38" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">Vista Cenital: Sincronía Casi 1:1 (Goteros a 30cm)</text>

  <!-- Camellón (Bed) -->
  <rect x="0" y="140" width="800" height="220" fill="url(#soilGradient)" />
  <rect x="0" y="140" width="800" height="220" fill="url(#soilTexture)" />
  <text x="400" y="350" font-size="14" fill="#f8fafc" opacity="0.8" font-weight="bold" text-anchor="middle">Mesa del Camellón Doble (1.00 m de ancho)</text>

  <!-- Aisles (Pasillos) -->
  <rect x="0" y="90" width="800" height="50" fill="#e2e8f0" opacity="0.9" />
  <text x="400" y="120" font-size="14" fill="#64748b" text-anchor="middle" font-weight="bold" font-style="italic">Pasillo de Tránsito / Trabajo (1.00 m)</text>
  <line x1="0" y1="140" x2="800" y2="140" stroke="#94a3b8" stroke-width="3" stroke-dasharray="10 5" />
  
  <rect x="0" y="360" width="800" height="50" fill="#e2e8f0" opacity="0.9" />
  <text x="400" y="390" font-size="14" fill="#64748b" text-anchor="middle" font-weight="bold" font-style="italic">Pasillo de Tránsito / Trabajo (1.00 m)</text>
  <line x1="0" y1="360" x2="800" y2="360" stroke="#94a3b8" stroke-width="3" stroke-dasharray="10 5" />

  <!-- Drip Tapes (Cintas de Goteo) -->
  <line x1="0" y1="200" x2="800" y2="200" stroke="#0f172a" stroke-width="4" />
  <line x1="0" y1="200" x2="800" y2="200" stroke="#3b82f6" stroke-width="2" stroke-dasharray="8 4" />

  <line x1="0" y1="300" x2="800" y2="300" stroke="#0f172a" stroke-width="4" />
  <line x1="0" y1="300" x2="800" y2="300" stroke="#3b82f6" stroke-width="2" stroke-dasharray="8 4" />

  <!-- Plants & Drippers on Top Tape (Y=200) - Spaced by 150px (representing 28cm) -->
  <use href="#pepperPlant" x="120" y="200" />
  <use href="#dripper" x="120" y="200" />
  
  <use href="#pepperPlant" x="270" y="200" />
  <use href="#dripper" x="270" y="200" />
  
  <use href="#pepperPlant" x="420" y="200" />
  <use href="#dripper" x="420" y="200" />
  
  <use href="#pepperPlant" x="570" y="200" />
  <use href="#dripper" x="570" y="200" />
  
  <use href="#pepperPlant" x="720" y="200" />
  <use href="#dripper" x="720" y="200" />

  <!-- Plants & Drippers on Bottom Tape (Y=300) (Offset by 75px for Tresbolillo) -->
  <use href="#pepperPlant" x="195" y="300" />
  <use href="#dripper" x="195" y="300" />
  
  <use href="#pepperPlant" x="345" y="300" />
  <use href="#dripper" x="345" y="300" />
  
  <use href="#pepperPlant" x="495" y="300" />
  <use href="#dripper" x="495" y="300" />
  
  <use href="#pepperPlant" x="645" y="300" />
  <use href="#dripper" x="645" y="300" />

  <!-- Annotations / Dimensions -->
  
  <!-- Arrow for distance between plants in the same line -->
  <line x1="120" y1="145" x2="270" y2="145" stroke="#fef08a" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  <rect x="155" y="135" width="80" height="20" fill="#ca8a04" rx="4" />
  <text x="195" y="149" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">28 cm</text>
  
  <!-- Arrow for Tresbolillo diagonal -->
  <line x1="120" y1="200" x2="195" y2="300" stroke="#fef08a" stroke-width="2" stroke-dasharray="4 4" />
  <rect x="110" y="260" width="85" height="20" fill="#ca8a04" rx="4" />
  <text x="152" y="274" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">Tresbolillo</text>

  <!-- Note for Gotero exact position -->
  <path d="M 420 205 L 450 250" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-dasharray="3 3"/>
  <rect x="420" y="250" width="160" height="24" fill="#1e293b" opacity="0.9" rx="4" />
  <text x="500" y="266" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">Desfase máximo: ~1.5 cm</text>

  <!-- Bottom Data Banner -->
  <rect x="100" y="420" width="600" height="60" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  
  <text x="250" y="445" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Disposición</text>
  <text x="250" y="465" font-size="13" fill="#16a34a" font-weight="bold" text-anchor="middle">Plantas a 28.5 cm (Tresbolillo)</text>
  
  <line x1="400" y1="430" x2="400" y2="470" stroke="#cbd5e1" stroke-width="2" />
  
  <text x="550" y="445" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Especificación de Cinta</text>
  <text x="550" y="465" font-size="13" fill="#3b82f6" font-weight="bold" text-anchor="middle">Goteros a 30 cm (1.5 L/h)</text>
</svg>
